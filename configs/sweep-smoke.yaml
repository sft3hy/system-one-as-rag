# Phase 0+1 sweep: new System-1 families, SMALL first.
# Smoke:  sufficiency-lab -c configs/sweep-smoke.yaml            (limit 20)
# Calib:  sufficiency-lab -c configs/sweep-smoke.yaml --limit 150
#
# Gates before any real run (FINDINGS §1 blockers):
#   endpoint answers / scores non-flat / instruction-sensitive / deterministic.
# Encoders need their sidecars up first:
#   .venv-encoder/bin/python scripts/encoder_sidecar.py laya 8101 &
#   .venv-encoder/bin/python scripts/encoder_sidecar.py von  8102 &
#
# model ids below MUST be confirmed against /v1/models after
# POST /admin/api/reload (§9: fresh checkpoints are invisible until reload).

run:
  id: sweep-smoke-v1
  dataset: sufficiencybench
  data_path: ./data/raw
  out_dir: ./results
  splits: [val, test]
  limit: 20

omlx:
  base_url: http://127.0.0.1:8000/v1
  settings_path: ~/.omlx/settings.json
  timeout_s: 600
  retries: 2
  max_concurrency: 1
  truncate: true

risk:
  max_false_sufficient: 0.05
  bootstrap: 2000
  seed: 13

latency:
  warmup: 3
  repeats: 1
  concurrency: [1]
  fast_budget_ms: 200
  judge_budget_ms: 900
  escalate_low: 0.35
  escalate_high: 0.75
  t_conflict: 0.50

models:
  # Tier A — omlx-native decision endpoint (release notes: OpenJev supported)
  - name: openjev-flash-9b
    kind: system1
    model: OpenJev-Flash-9B-MLX        # confirm exact served id post-reload
    batch_questions: true
    extra: {diagnostic: true}

  - name: openjev-27b-4bit
    kind: system1
    model: openjev-MLX-4bit            # CC-BY-NC: BENCHMARK ONLY, never production
    batch_questions: true
    extra: {diagnostic: true}

  # Tier C — Tev AR structured decision. omlx serves no logprobs on chat,
  # so score = k-sampled vote rate (see ar_decision.py docstring).
  - name: tev1-4b
    kind: ar_decision
    model: Tev1-4B-experimental
    extra:
      samples: 12
      temperature: 1.0

  # NOTE: clef-omni-4bit REMOVED by Phase 0 — omlx cannot load qwen3_omni_moe
  # (HTTP 409 "Model type qwen3_omni_moe not supported"). Blocked until the
  # server adds the architecture; not configurable around.

  # Tier B — encoder sidecars (start them first; off-GPU, own venv)
  - name: laya
    kind: encoder
    model: convaiinnovations/laya
    extra: {sidecar_url: http://127.0.0.1:8101}

  - name: laya-typed-decisions
    kind: encoder
    model: convaiinnovations/laya-typed-decisions
    extra: {sidecar_url: http://127.0.0.1:8103}   # dedicated sidecar —
    # NOT 8101: that one serves the multilingual head, this arm needs its own
    # checkpoint or the arm name lies about what ran

  - name: von-1.3
    kind: encoder
    model: wfzyx/von
    extra:
      sidecar_url: http://127.0.0.1:8102
      # von scores noul scalars far better than our choice options
      # (smoke AUROC 0.740 vs 0.58, n=48 val) — native axis
      primitive: noul
      noul_instructions: >-
        The retrieved context is sufficient to answer the question completely
        and correctly.
