[project]
name = "sufficiency-lab"
version = "0.1.0"
description = "Benchmark sufficiency gates for RAG: System 1 decision models (Clef via omlx), autoregressive judges, and classifier baselines on identical inputs"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "huggingface-hub>=2.2.0",
]

[project.scripts]
sufficiency-lab = "sufficiency_lab.runner:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sufficiency_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
